# Perfil EXCLUSIVO de testes automatizados. H2 em memória, schema criado pelo
# Hibernate (a validação de Flyway/PostgreSQL é feita à parte, contra um
# PostgreSQL real). Nenhum dado comercial: tenants/usuários de teste são
# criados pelos próprios testes e existem só neste banco descartável.
spring.datasource.url=jdbc:h2:mem:nexus-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.h2.console.enabled=false

jwt.secret=test-only-secret-test-only-secret-test-only-secret-0123456789
app.seed-demo-data=false
dev.admin.username=
dev.admin.password=
