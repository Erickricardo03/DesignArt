spring.application.name=designart-api
server.port=${PORT:8080}

# Por padrao roda em modo desenvolvimento. Em producao, defina explicitamente
# a variavel de ambiente SPRING_PROFILES_ACTIVE=prod na infraestrutura de deploy.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# H2 Console fica desligado por padrao; o perfil dev reabre explicitamente.
spring.h2.console.enabled=false

# Corpo de erro com mensagem (necessario para o frontend mostrar "erro
# apropriado" em vez de uma resposta vazia), mas sem stacktrace (nunca exponha
# detalhes internos do servidor ao cliente).
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# JPA / Hibernate (cada perfil ajusta datasource e ddl-auto conforme necessario)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT: expiracao e comum, mas o segredo (jwt.secret) NUNCA fica aqui.
# Cada perfil define sua propria origem — veja application-dev.properties e
# application-prod.properties.
# 8 horas (Fase 4.1; antes 24h). Sessões também são revogáveis via users.token_version.
jwt.expiration=28800000

# Seed de dados de demonstracao: desligado por padrao (seguranca em profundidade).
# Somente o perfil dev liga isso explicitamente.
app.seed-demo-data=false

# Flyway desligado por padrao; somente o perfil prod liga explicitamente.
# O perfil dev continua usando H2 + ddl-auto=update (inalterado da Fase 1).
spring.flyway.enabled=false

# File Upload Limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ------------------------------------------------------------------
# Auditoria (Fase 4.2) — IP do cliente
# Lista (separada por virgula) de IPs/CIDRs de proxies CONFIAVEIS. Vazia por
# padrao: o IP registrado e SEMPRE o da conexao TCP e o header X-Forwarded-For
# (valor arbitrario do cliente) e ignorado. Quando a aplicacao ficar atras do
# proxy da Nexus, defina TRUSTED_PROXIES (ex.: 10.0.0.0/8,127.0.0.1) e garanta que
# o proxy SOBRESCREVA X-Forwarded-For com o IP real da conexao que recebeu.
# ------------------------------------------------------------------
app.security.trusted-proxies=${TRUSTED_PROXIES:}

# ------------------------------------------------------------------
# E-mail transacional (Fase 4.3) — configuracao SOMENTE por variaveis de ambiente.
# NEXUS_MAIL_ENABLED=false por padrao: sem e-mail, NENHUM token de recuperacao/convite e
# gerado e nada e impresso. Para habilitar defina: NEXUS_MAIL_ENABLED=true, MAIL_HOST,
# MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM (ex.: contato@nexusdevelopment.tech),
# MAIL_FROM_NAME, MAIL_STARTTLS, MAIL_SSL e APP_PUBLIC_URL (URL do frontend, sem barra final).
# NUNCA coloque a senha da caixa postal neste arquivo.
# ------------------------------------------------------------------
nexus.mail.enabled=${NEXUS_MAIL_ENABLED:false}
nexus.mail.from=${MAIL_FROM:}
nexus.mail.from-name=${MAIL_FROM_NAME:Nexus Design}
nexus.mail.async=true
app.public-url=${APP_PUBLIC_URL:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ------------------------------------------------------------------
# Rate limiting (em memoria; instancia unica). Limites configuraveis:
#   nexus.ratelimit.<politica>.max e nexus.ratelimit.<politica>.window-seconds
# Politicas: login-ip, login-ip-identity, forgot-ip, forgot-identity, reset-ip,
# accept-invite-ip, invite-create-actor, invite-resend-actor.
# Varias instancias exigirao um armazenamento compartilhado (banco/Redis).
# ------------------------------------------------------------------

# ------------------------------------------------------------------
# Bootstrap do primeiro SUPER_ADMIN (Fase 4.4.1) — DESABILITADO por padrao.
# Para criar o primeiro SUPER_ADMIN (somente se nenhum existir; idempotente) defina no AMBIENTE:
#   NEXUS_BOOTSTRAP_ENABLED=true
#   NEXUS_BOOTSTRAP_EMAIL=<e-mail do administrador>
#   NEXUS_BOOTSTRAP_PASSWORD_HASH=<hash BCrypt, custo >= 10, gerado OFFLINE>
# A senha em texto puro NUNCA e informada nem gravada. Depois do primeiro acesso, volte
# NEXUS_BOOTSTRAP_ENABLED para false e remova o hash do ambiente. Nada disto tem valor aqui.
# ------------------------------------------------------------------
nexus.bootstrap.enabled=${NEXUS_BOOTSTRAP_ENABLED:false}
nexus.bootstrap.email=${NEXUS_BOOTSTRAP_EMAIL:}
nexus.bootstrap.password-hash=${NEXUS_BOOTSTRAP_PASSWORD_HASH:}
