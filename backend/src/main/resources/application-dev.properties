# ============================================================
# Perfil de DESENVOLVIMENTO LOCAL — nunca usar em producao.
# Ativo por padrao (application.properties usa SPRING_PROFILES_ACTIVE:dev).
# ============================================================

# H2 em memoria: reinicia zerado a cada start do backend.
spring.datasource.url=jdbc:h2:mem:designartdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Flyway NAO gerencia o H2 de dev (continua no ddl-auto=update de sempre).
# A estrutura versionada em db/migration é escrita e validada para
# PostgreSQL (perfil prod) — ver application-prod.properties.
spring.flyway.enabled=false

# Segredo JWT somente para desenvolvimento local. Pode ser sobrescrito pela
# variavel de ambiente JWT_SECRET. NUNCA reaproveite este valor em producao.
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-trocar-antes-de-qualquer-deploy-0123456789}

# Liga o seed de dados FICTICIOS de demonstracao (clientes, tarefas, vendas,
# despesas, avaliacoes de exemplo etc.) apenas neste perfil.
app.seed-demo-data=true

# Usuario administrador de conveniencia para desenvolvimento local (opcional).
# So e criado se as duas variaveis abaixo forem definidas E se ainda nao
# existir nenhum usuario no banco. Sem elas, o backend sobe sem nenhum login
# ate que o mecanismo de SUPER_ADMIN (Fase 4) exista.
dev.admin.username=${DEV_ADMIN_USERNAME:}
dev.admin.password=${DEV_ADMIN_PASSWORD:}
