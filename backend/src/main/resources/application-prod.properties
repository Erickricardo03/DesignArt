# ============================================================
# Perfil de PRODUCAO.
# Ative definindo a variavel de ambiente SPRING_PROFILES_ACTIVE=prod.
# ============================================================

spring.h2.console.enabled=false

# Segredo JWT obrigatorio via variavel de ambiente — sem valor padrao aqui de
# proposito: se JWT_SECRET nao estiver definido, a aplicacao falha ao subir em
# vez de usar um segredo previsivel/inseguro.
jwt.secret=${JWT_SECRET}

# Em producao o banco NUNCA e populado com dados de demonstracao.
app.seed-demo-data=false

# ------------------------------------------------------------
# PostgreSQL (Fase 2) — somente variaveis de ambiente, sem nenhum valor
# padrao. Se DB_URL/DB_USERNAME/DB_PASSWORD nao estiverem definidas, a
# aplicacao falha ao subir (mesmo principio do JWT_SECRET) em vez de cair
# silenciosamente em H2 ou em qualquer outro banco.
#
# DB_URL no formato: jdbc:postgresql://<host>:<porta>/<database>
# ------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# O Hibernate NUNCA cria/altera schema em producao — isso e responsabilidade
# exclusiva do Flyway (migrations em src/main/resources/db/migration).
# "validate" apenas confere se o schema aplicado pelo Flyway bate com o que
# as entidades JPA esperam; se nao bater, a aplicacao falha ao subir.
spring.jpa.hibernate.ddl-auto=validate

# Flyway aplica as migrations ANTES do Hibernate validar o schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
